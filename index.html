<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATH-LOGIC | Simple Mental Math</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <main class="container">
        <header class="game-header">
            <h1>MATH-LOGIC</h1>
            <div class="stats">
                <div class="stat-item">
                    <span class="label">SCORE</span>
                    <span id="score" class="value">0</span>
                </div>
                <div class="stat-item">
                    <span class="label">TIME</span>
                    <span id="timer" class="value">60</span>
                </div>
            </div>
        </header>

        <section id="game-card" class="glass-card">
            <div id="start-screen" class="screen active">
                <h2>Ready to Start?</h2>
                <p>マイナス数値を含む四則演算に挑戦しましょう。</p>
                <button id="start-btn" class="primary-btn">START GAME</button>
            </div>

            <div id="play-screen" class="screen">
                <div class="problem-container">
                    <div id="problem-text" class="problem">12 + (-5) = ?</div>
                </div>
                <div class="input-container">
                    <input type="text" id="answer-input" placeholder="?" autocomplete="off" readonly>
                </div>
                <div id="keypad" class="keypad">
                    <button class="key">1</button>
                    <button class="key">2</button>
                    <button class="key">3</button>
                    <button class="key">4</button>
                    <button class="key">5</button>
                    <button class="key">6</button>
                    <button class="key">7</button>
                    <button class="key">8</button>
                    <button class="key">9</button>
                    <button class="key" data-action="minus">-</button>
                    <button class="key">0</button>
                    <button class="key" data-action="clear">C</button>
                    <button class="key wide" data-action="enter">ENTER</button>
                </div>
                <div id="feedback" class="feedback"></div>
            </div>

            <div id="result-screen" class="screen">
                <h2>Game Over</h2>
                <div class="final-score">
                    <span class="label">FINAL SCORE</span>
                    <span id="final-score-val" class="value">000</span>
                </div>
                <button id="restart-btn" class="primary-btn">TRY AGAIN</button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MATH-LOGIC | Time Attack Math</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@700&family=Outfit:wght@600&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <main class="container">
        <header class="game-header">
            <h1>MATH-LOGIC</h1>
            <div class="stats">
                <div class="stat-item">
                    <span class="label">TIME</span>
                    <span id="timer" class="value">00:00.0</span>
                </div>
                <div class="stat-item">
                    <span class="label">PROGRESS</span>
                    <span id="score" class="value">0 / 10</span>
                </div>
            </div>
        </header>

        <section id="game-card" class="glass-card">
            <div id="start-screen" class="screen active">
                <h2>Settings</h2>

                <div class="settings-group">
                    <label>NUMBER MODE</label>
                    <div class="mode-chips">
                        <div class="mode-chip active" data-mode="integer">INTEGER</div>
                        <div class="mode-chip" data-mode="decimal">DECIMAL</div>
                        <div class="mode-chip" data-mode="fraction">FRACTION</div>
                    </div>
                </div>

                <div class="settings-group">
                    <label>PROBLEM COUNT</label>
                    <div class="count-chips">
                        <div class="count-chip active" data-count="10">10</div>
                        <div class="count-chip" data-count="50">50</div>
                        <div class="count-chip" data-count="100">100</div>
                    </div>
                </div>

                <div class="settings-group">
                    <label>OPERATORS</label>
                    <div class="operator-chips">
                        <div class="chip active" data-op="+">+</div>
                        <div class="chip active" data-op="-">-</div>
                        <div class="chip active" data-op="*">×</div>
                        <div class="chip" data-op="/">÷</div>
                    </div>
                </div>

                <div class="settings-row">
                    <div class="settings-group">
                        <label>DIGITS</label>
                        <input type="number" id="digit-select" value="1" min="1" max="5">
                    </div>
                    <div class="settings-group">
                        <label>TERMS</label>
                        <input type="number" id="term-select" value="2" min="2" max="5">
                    </div>
                </div>

                <p>目標の問題数を最速で解き切りましょう。</p>
                <button id="start-btn" class="primary-btn">START TIME ATTACK</button>
            </div>

            <div id="play-screen" class="screen">
                <div class="problem-container">
                    <div id="problem-text" class="problem">12 + (-5) = ?</div>
                </div>
                <div class="input-container">
                    <input type="text" id="answer-input" placeholder="?" autocomplete="off" readonly>
                </div>
                <div id="keypad" class="keypad">
                    <button class="key">1</button>
                    <button class="key">2</button>
                    <button class="key">3</button>
                    <button class="key">4</button>
                    <button class="key">5</button>
                    <button class="key">6</button>
                    <button class="key">7</button>
                    <button class="key">8</button>
                    <button class="key">9</button>
                    <button class="key">0</button>
                    <button class="key" data-action="dot">.</button>
                    <button class="key" data-action="fraction">/</button>
                    <button class="key" data-action="minus">-</button>
                    <button class="key" data-action="clear">C</button>
                    <button class="key wide" data-action="enter">ENTER</button>
                </div>
                <div id="feedback" class="feedback"></div>
            </div>

            <div id="result-screen" class="screen">
                <h2>Excellent!</h2>
                <div class="result-stats">
                    <div class="final-stat">
                        <span class="label">TOTAL TIME</span>
                        <span id="final-time" class="value">00:00.0</span>
                    </div>
                </div>
                <button id="restart-btn" class="primary-btn">TRY AGAIN</button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
